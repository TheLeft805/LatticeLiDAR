name: Release contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - name: CPU contracts and integrity (not GPU validation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-logs
          python --version 2>&1 | tee validation-logs/environment.txt
          python -m pip freeze >> validation-logs/environment.txt
          git rev-parse HEAD >> validation-logs/environment.txt
          python tools/verify_assets.py 2>&1 | tee validation-logs/assets.txt
          python -m unittest discover -s tests -v 2>&1 | tee validation-logs/cpu-tests.txt
          python encode.py --help > validation-logs/encode-help.txt
          python decode.py --help > validation-logs/decode-help.txt
      - name: Preserve CPU validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-validation-${{ github.sha }}
          path: validation-logs/
          if-no-files-found: warn
          retention-days: 30
